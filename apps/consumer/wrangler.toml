name = "bunderlog-consumer"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[queues.consumers]]
queue = "bunderlog-logs"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3

[[d1_databases]]
binding = "DB"
database_name = "bunderlog"
database_id = "placeholder"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "bunderlog-archive"

[[kv_namespaces]]
binding = "COUNTERS"
id = "placeholder"
